{% extends 'base.html' %}{% block content %}<div class="top"><h1>Courses</h1><a class="btn" href="{% url 'course_create' %}">Add course</a></div><table><tr><th>Course</th><th>Sector</th><th>Duration</th></tr>{% for course in courses %}<tr><td>{{ course.name }}</td><td>{{ course.sector }}</td><td>{{ course.duration }}</td></tr>{% empty %}<tr><td colspan="3" class="empty">No courses available.</td></tr>{% endfor %}</table>{% endblock %}
