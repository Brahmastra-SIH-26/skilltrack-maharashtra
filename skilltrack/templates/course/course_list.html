<!DOCTYPE html>
<html>
<head>
    <title>Courses</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            color: #1f2937;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .course-name {
            font-size: 18px;
            font-weight: bold;
            color: #111827;
            margin-bottom: 8px;
        }

        .info {
            color: #6b7280;
            margin: 5px 0;
        }

        .empty {
            text-align: center;
            color: #6b7280;
        }
        .add-btn {
    display: inline-block;
    background: #2563eb;
    color: white;
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 7px;
    margin-bottom: 20px;
    font-weight: bold;
}

.add-btn:hover {
    background: #1d4ed8;
}
    </style>
</head>

<body>

<div class="container">

    <h1>Course Management</h1>
<a href="{% url 'course_create' %}" class="add-btn">
    + Add Course
</a>
    <p class="subtitle">
        Manage the courses available for SkillTrack Maharashtra training programs.
    </p>

    {% for course in courses %}

        <div class="card">

            <div class="row">

                <div>

                    <div class="course-name">
                        {{ course.name }}
                    </div>

                    <div class="info">
                        <strong>Sector:</strong>
                        {{ course.sector }}
                    </div>

                    <div class="info">
                        <strong>Duration:</strong>
                        {{ course.duration }}
                    </div>

                </div>

            </div>

        </div>

    {% empty %}

        <div class="card empty">
            <p>No courses have been added yet.</p>
        </div>

    {% endfor %}

</div>


</body>
</html>
