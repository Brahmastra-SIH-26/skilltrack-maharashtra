{% extends 'base.html' %}{% block content %}<h1>{{ provider.name }}</h1><div class="card"><p>{{ provider.provider_type }} · {{ provider.district }} · Rating {{ provider.rating }}</p><span class="badge {{ provider.status }}">{{ provider.status }}</span>{% if provider.status == 'Pending' %}<p><form class="inline" method="post" action="{% url 'verify_provider' provider.id %}">{% csrf_token %}<button>Verify provider</button></form> <form class="inline" method="post" action="{% url 'reject_provider' provider.id %}">{% csrf_token %}<button class="btn danger">Reject</button></form></p>{% endif %}</div>{% endblock %}
