<!DOCTYPE html>
<html>
<head>
    <title>Provider Details</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        h1 {
            color: #1f2937;
            margin-bottom: 25px;
        }

        .detail {
            padding: 13px 0;
            border-bottom: 1px solid #eee;
            color: #374151;
        }

        .status {
            font-weight: bold;
        }

        .pending {
            color: #b45309;
        }

        .verified {
            color: #047857;
        }

        .rejected {
            color: #dc2626;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 7px;
            color: white;
            cursor: pointer;
            margin-right: 10px;
        }

        .verify {
            background: #16a34a;
        }

        .reject {
            background: #dc2626;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Provider Details</h1>

        <div class="detail">
            <strong>Provider Name:</strong>
            {{ provider.name }}
        </div>

        <div class="detail">
            <strong>Provider Type:</strong>
            {{ provider.provider_type }}
        </div>

        <div class="detail">
            <strong>District:</strong>
            {{ provider.district }}
        </div>

        <div class="detail">
            <strong>Rating:</strong>
            {{ provider.rating }}
        </div>

        <div class="detail">
            <strong>Status:</strong>

            <span class="status
                {% if provider.status == 'Pending' %}
                    pending
                {% elif provider.status == 'Verified' %}
                    verified
                {% else %}
                    rejected
                {% endif %}
            ">
                {{ provider.status }}
            </span>
        </div>

        {% if provider.status == "Pending" %}

            <br>

            <form method="POST"
                  action="{% url 'verify_provider' provider.id %}"
                  style="display:inline;">

                {% csrf_token %}

                <button type="submit" class="verify">
                    Verify Provider
                </button>

            </form>

            <form method="POST"
                  action="{% url 'reject_provider' provider.id %}"
                  style="display:inline;">

                {% csrf_token %}

                <button type="submit" class="reject">
                    Reject Provider
                </button>

            </form>

        {% endif %}

        <br>

        <a href="{% url 'provider_list' %}" class="back">
            ← Back to Provider List
        </a>

    </div>

</div>

</body>
</html>
