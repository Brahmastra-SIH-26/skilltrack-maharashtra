<!DOCTYPE html>
<html>
<head>

    <title>
        {% if trainee %}
            Edit Trainee
        {% else %}
            Add Trainee
        {% endif %}
    </title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.06);
        }

        h1 {
            color: #1f2937;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #374151;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 10px;
        }

        button,
        .back {
            padding: 11px 18px;
            border-radius: 7px;
            border: none;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        button {
            background: #2563eb;
            color: white;
        }

        .back {
            background: #e5e7eb;
            color: #374151;
        }

        .errors {
            color: #dc2626;
            margin-top: 15px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>
            {% if trainee %}
                Edit Trainee
            {% else %}
                Add New Trainee
            {% endif %}
        </h1>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <div class="buttons">

                <button type="submit">
                    {% if trainee %}
                        Update Trainee
                    {% else %}
                        Add Trainee
                    {% endif %}
                </button>

                <a href="{% url 'trainee_list' %}" class="back">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
