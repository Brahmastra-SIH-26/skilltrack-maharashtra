<!DOCTYPE html>
<html>
<head>
    <title>Trainer Registration - SkillTrack Maharashtra</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 7px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .errorlist {
            color: #dc2626;
            margin: 5px 0;
            padding-left: 20px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Trainer / Provider Registration</h1>

    <p class="subtitle">
        Register your training details. Your application will be reviewed
        by the Authority before approval.
    </p>

    <form method="POST">

        {% csrf_token %}

        {% for field in form %}

            <div class="form-group">

                {{ field.label_tag }}

                {{ field }}

                {{ field.errors }}

            </div>

        {% endfor %}

        <button type="submit">
            Submit Registration
        </button>

    </form>

    <a href="{% url 'dashboard' %}" class="back">
        ← Back to Portal
    </a>

</div>

</body>
</html>
