<!DOCTYPE html>
<html>
<head>
    <title>Assign Training | SkillTrack Maharashtra</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 650px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #0d6efd;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .back {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            color: #555;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Assign Training</h1>

        <p>Assign a course and training provider to a trainee.</p>

        <form method="POST">

            {% csrf_token %}

            {% for field in form %}

                <div class="field">

                    {{ field.label_tag }}

                    {{ field }}

                    {% if field.errors %}
                        <small style="color:red;">
                            {{ field.errors }}
                        </small>
                    {% endif %}

                </div>

            {% endfor %}

            <button type="submit">
                Assign Training
            </button>

        </form>

        <a href="{% url 'dashboard' %}" class="back">
            ← Back to Dashboard
        </a>

    </div>

</div>

</body>
</html>
